<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fly to a location</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; left: 125px; width: 90%; }
</style>
</head>
<body>
<style>

</style>
<div id="map"></div>
<br>
<h3 id = "link1">Click me</h3>
<h3 id = "link2">setPitch</h3>
<script>
	mapboxgl.accessToken = 'pk.eyJ1IjoibjFjaHJpc3RpYW4iLCJhIjoiY2x6MG80Y2hrMTgxaDJrcHNkMWtvZWx0MCJ9.kHvL5J2yJH2lPYSmk7sBng';
    const map = new mapboxgl.Map({
        container: 'map',
        // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [-74.5, 40],
        zoom: 4
    });

    document.getElementById('link1').addEventListener('click', () => {
        // Fly to a random location
        map.flyTo({
            zoom: 15,
            center: [114.17475, 22.29412],
            essential: true
        });
        console.log(map.getPitch())
    });
    document.getElementById('link2').addEventListener('click', () => {
        map.setPitch(50);
    });
</script>

</body>
</html>
