<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Load data from an external GeoJSON file</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; left:190px; width: 85%; }

#menu {
        background: #fff;
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1;
        border-radius: 3px;
        width: 120px;
        border: 1px solid rgba(0, 0, 0, 0.4);
        font-family: 'Open Sans', sans-serif;
    }

    #menu a{
        width: 110px;
        height: 20px;
        display: block;
        text-decoration: none;
        text-align: center;
        border-bottom: 1px solid rgba(0, 0, 0, 0.25);
        padding: 5px;
        color: #404040;
    }

    #menu a:last-child {
        border: none;
    }

    #menu a.active{
        background-color: #3887be;
        color: #ffffff;
    }

    #menu a.active:hover{
        background-color: #0d5f99;
        color: #ffffff;
    }

    #building_name{
        position: absolute;
        left:75px;
        top:-5px;
    }

#building_type{
        position: absolute;
        left:75px;
        top:40px;
    }

.popup{
        width: 290px;
        height: 75px;
        background-color: white;
        /**border: 1px solid #000; **/
        padding: 5px;
        box-sizing: border-box;
        border-radius: 30px;
    }
</style>
</head>

<body>
<nav id="menu"></nav>
<div id="map"></div>

<ul style="padding: 0px 0px 0px 15px; font-size:16px; line-height: 2.5;">HK major buildings list
    <li id="HKG" style="font-size: 10px;">Hong Kong international Airport</li>
    <li id="PolyU" style="font-size: 10px;">The Hong Kong Polytechnic University</li>
    <li id="CityU" style="font-size: 10px;">City University of Hong Kong</li>
</ul>

<script>
    //click on dot/on list -> fly + popup + image
    //zoomout -> both disappear
    const div = window.document.createElement('div');
    div.id = "";
    div.className = "popup";

    const img = window.document.createElement('img');
    img.id = "tag";
    img.src = "use.png";
    img.style.display = "inline";

    const h3 = window.document.createElement('h3');
    h3.id = "building_name";
    h3.style.display = "inline";
    h3.style.color = "blue";
    h3.textContent = "put_building_name_here";

    const p = window.document.createElement('p');
    p.id = "building_type";
    p.style.display = "inline";
    p.style.color = "grey";
    p.textContent = "put_building_type_here";

    div.appendChild(img);
    div.appendChild(h3);
    div.appendChild(p);

    const el = document.createElement('div');
                el.className = 'marker';
                el.style.width = "55px";
                el.style.height = "55px";
                el.style.backgroundSize = '150%';

    const geodata = {
    "type": "FeatureCollection",
    "crs": { "type": "name", "properties": { "name": "urn:ogc:def:crs:OGC:1.3:CRS84" } },
    "features": [

    { "type": "Feature", "properties": { "id": "PolyU", "building_name": "The Hong Kong Polytechnic University", "building_type": "Education" }, "geometry": { "type": "Point", "coordinates": [ 114.17982, 22.30460] } },
    { "type": "Feature", "properties": { "id": "CityU", "building_name": "City University of Hong Kong", "building_type": "Education" }, "geometry": { "type": "Point", "coordinates": [ 114.17307, 22.33644] } }
      
    ]
    }

    const infra_data = {
    "type": "FeatureCollection",
    "crs": { "type": "name", "properties": { "name": "urn:ogc:def:crs:OGC:1.3:CRS84" } },
    "features": [

    { "type": "Feature", "properties": { "id": "HKG", "building_name": "Hong Kong international Airport", "building_type": "Infrastructure" }, "geometry": { "type": "Point", "coordinates": [ 113.92486, 22.31213] } }
    ]
    }

    const imagedata = {
        "HKG":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgjRYB47G_47co5r0KeFdh2g9JqzXYP9XICg&s",
        "PolyU":"https://www.polyu.edu.hk/-/media/department/home/thumb/campus-development.jpg?bc=ffffff&w=468&hash=E88F1DAC38173D03318333B89B52F985",
        "CityU":"https://www.cityu.edu.hk/sites/g/files/asqsls3821/files/styles/crop_cityu_section_intro_735_551/public/2018-12/1.%EF%BC%98_0.jpg?h=70c85895&itok=AeR8u7G0",
    }

    mapboxgl.accessToken = 'pk.eyJ1IjoibjFjaHJpc3RpYW4iLCJhIjoiY2x6MG80Y2hrMTgxaDJrcHNkMWtvZWx0MCJ9.kHvL5J2yJH2lPYSmk7sBng'

    //map creation
    const map = new mapboxgl.Map({
        container: 'map',
        //style: 'mapbox://styles/mapbox/satellite-v9', // style URL
        style: "mapbox://styles/mapbox/standard",
        projection: 'globe', // Display the map as a globe, since satellite-v9 defaults to Mercator
        zoom: 12, 
        center: [114.17460, 22.29529] 
    });


    map.on('load', () => {
        map.addSource('univ', {
            type: 'geojson',
            data: geodata
        });

        map.addLayer({
            'id': 'universities',
            'type': 'circle',
            'source': 'univ',
            'paint': {
                'circle-radius': 4,
                'circle-stroke-width': 2,
                'circle-color': 'blue',
                'circle-stroke-color': 'white'
            },
            'layout': {
                // Make the layer visible by default.
                'visibility': 'visible'
            }
        });

        map.addSource('infra', {
            type: 'geojson',
            data: infra_data
        });

        map.addLayer({
            'id': 'infrastructure',
            'type': 'circle',
            'source': 'infra',
            'paint': {
                'circle-radius': 4,
                'circle-stroke-width': 2,
                'circle-color': 'blue',
                'circle-stroke-color': 'white'
            },
            'layout': {
                // Make the layer visible by default.
                'visibility': 'visible'
            }
        });
    });

map.on('idle', () => {
    const btns = ["infrastructure", "universities"]

    //use DOM to create 2 <a tag>
    for (const id of btns) {

        //check if tag already exist
        if (document.getElementById(id)) {
            continue;
        }

    //<a id="infrasturcture" href="#" class="active">infrasturcture</a>
    const link = document.createElement("a")
    link.id = id;
    link.href = '#';
    link.textContent = id;
    link.className = 'active';

    link.onclick = function (e) {
        const clickedLayer = this.textContent;
            e.preventDefault();
            e.stopPropagation();

        const visibility = map.getLayoutProperty(
                    clickedLayer,
                    'visibility' //default: visible
                );

        if (visibility === 'visible') {
                map.setLayoutProperty(clickedLayer, 'visibility', 'none');
                this.className = '';
            } else {
                this.className = 'active';
                map.setLayoutProperty(
                    clickedLayer,
                    'visibility',
                    'visible'
                );
            }
    }
        //use DOM to grab the menu element
        const menu = document.getElementById("menu");

        //last step attach the a tags to the menu element through DOM
        menu.appendChild(link)
    
    }
    });  
    
    // Create a popup, but don't add it to the map yet.
    const popup1 = new mapboxgl.Popup({closeButton:true, closeOnClick:false})

    var marker1 = new mapboxgl.Marker()

    map.on('click', 'universities', (e) => {
        // console.log(e.features[0].properties)
        // console.log(e.features[0].geometry)

        coordinates = e.features[0].geometry.coordinates
        const building_name = geodata.features[0].properties.building_name;     
        const building_type = geodata.features[0].properties.building_type;
        const building_id = e.features[0].properties.id;
                
        div.querySelector("#building_name").innerHTML = building_name
        div.querySelector("#building_type").innerHTML = building_type
        div.id = building_id

        el.style.backgroundImage = `url(${imagedata[building_id]})`;
        const newCoord = [coordinates[0]+0.0001, coordinates[1]+0.0001]
        marker1 = new mapboxgl.Marker(el)
        marker1
            .setLngLat(newCoord)
            .addTo(map);

        popup1
            .setMaxWidth('30em')
            .setLngLat(coordinates)
            .setDOMContent(div)
            .addTo(map)
    });

    //popup removal
    map.on('zoom', () => {
        if (map.getZoom() < 15) {
            popup1.remove()
            marker1.remove()
        }

    });


    document.getElementById('HKG').addEventListener('click', () => {
        map.flyTo({
            center: [113.92486, 22.31213],
            essential: true,
            zoom: 17, //default 12
            pitch:71.5,
            bearing: 33.3
            })
            map.once('zoomend', () => {
                const coordinates = infra_data.features[0].geometry.coordinates;  
                const building_name = infra_data.features[0].properties.building_name;     
                const building_type = infra_data.features[0].properties.building_type;
                
                div.querySelector("#building_name").innerHTML = building_name
                div.querySelector("#building_type").innerHTML = building_type
                div.id = geodata.features[0].properties.id
                
                el.id = geodata.features[0].properties.id;

                el.style.backgroundImage = `url(${imagedata.HKG})`;

                
                //114.17982, 22.3046
                //114.17982 - 0.0001
                //coordinates[0] +:right, -:left
                const newCoord = [coordinates[0]-0.00015, coordinates[1]-0.0002]
                marker1 = new mapboxgl.Marker(el)
                marker1
                    .setLngLat(newCoord)
                    .addTo(map);



                popup1
                    .setMaxWidth('30em')
                    .setLngLat(coordinates)
                    .setDOMContent(div)
                    .addTo(map)
                });
        });
        
        document.getElementById('PolyU').addEventListener('click', () => {
            map.flyTo({
                zoom: 17.7, //default 12
                pitch:69.5,
                bearing: 81.3,
                center: [114.17982, 22.30460],
                essential: true
                });  
            map.once('zoomend', () => {
                const coordinates = geodata.features[0].geometry.coordinates;  
                const building_name = geodata.features[0].properties.building_name;     
                const building_type = geodata.features[0].properties.building_type;
                
                div.querySelector("#building_name").innerHTML = building_name
                div.querySelector("#building_type").innerHTML = building_type
                div.id = geodata.features[1].properties.id
                
                el.id = geodata.features[1].properties.id;
                el.style.backgroundImage = `url(${imagedata.PolyU})`;
              
                marker1 = new mapboxgl.Marker(el)
                marker1
                    .setLngLat([114.17972, 22.3046])
                    .addTo(map);

                popup1
                    .setMaxWidth('30em')
                    .setLngLat(coordinates)
                    .setDOMContent(div)
                    .addTo(map)
                });
            
        });

        document.getElementById('CityU').addEventListener('click', () => {
        map.flyTo({
            center: geodata.features[1].geometry.coordinates,
            essential: true,
            zoom: 17.9,
            pitch:61,
            bearing: -153
            })
            map.once('zoomend', () => {
                const coordinates = geodata.features[1].geometry.coordinates;  
                const building_name = geodata.features[1].properties.building_name;     
                const building_type = geodata.features[1].properties.building_type;
                const building_id = geodata.features[1].properties.id;
                
                div.querySelector("#building_name").innerHTML = building_name
                div.querySelector("#building_type").innerHTML = building_type
                div.id = geodata.features[2].properties.id
                
                el.id = geodata.features[2].properties.id;
                el.style.backgroundImage = `url(${imagedata[building_id]})`;
                
                const newCoord = [coordinates[0]+0.0001, coordinates[1]+0.0001]
                marker1 = new mapboxgl.Marker(el)
                marker1
                    .setLngLat(newCoord)
                    .addTo(map);


                popup1
                    .setMaxWidth('30em')
                    .setLngLat(coordinates)
                    .setDOMContent(div)
                    .addTo(map)
                });

        });
    

</script>

</body>
</html>
