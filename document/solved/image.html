<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Add custom icons (images) with Markers</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<style>
    .marker {
        display: block;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
    }
</style>

<div id="map"></div>

<script>
	// TO MAKE THE MAP APPEAR YOU MUST
	// ADD YOUR ACCESS TOKEN FROM
	// https://account.mapbox.com
	mapboxgl.accessToken = 'pk.eyJ1IjoibjFjaHJpc3RpYW4iLCJhIjoiY2x6MG80Y2hrMTgxaDJrcHNkMWtvZWx0MCJ9.kHvL5J2yJH2lPYSmk7sBng';

    const geodata = {
    "type": "FeatureCollection",
    "crs": { "type": "name", "properties": { "name": "urn:ogc:def:crs:OGC:1.3:CRS84" } },
    "features": [

    { "type": "Feature", "properties": { "id": "HKG", "building_name": "Hong Kong international Airport", "building_type": "Infrastructure" }, "geometry": { "type": "Point", "coordinates": [ 113.92486, 22.31213] } },
    { "type": "Feature", "properties": { "id": "PolyU", "building_name": "The Hong Kong Polytechnic University", "building_type": "Education" }, "geometry": { "type": "Point", "coordinates": [ 114.17982, 22.30460] } }
    ]
    }

    const map = new mapboxgl.Map({
        container: 'map',
        // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [113.95486, 22.31513],
        zoom: 12
    });


    // Add markers to the map.
    for (const marker of geodata.features) {
        // Create a DOM element for each marker.
        const el = document.createElement('div');
        el.className = 'marker';
        const id_ = marker.properties.id;
        switch(id_) {
            case "HKG":
            el.style.backgroundImage = "url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgjRYB47G_47co5r0KeFdh2g9JqzXYP9XICg&s)";
            break;
            case "PolyU":
            el.style.backgroundImage = "url(https://www.polyu.edu.hk/-/media/department/home/thumb/campus-development.jpg?bc=ffffff&w=468&hash=E88F1DAC38173D03318333B89B52F985)";
            break;
        }
    
        el.style.width = "30px";
        el.style.height = "30px";
        el.style.backgroundSize = '150%';

        el.addEventListener('click', () => {
            window.alert(marker.properties.building_name);
        });

        // Add markers to the map.
        new mapboxgl.Marker(el)
            .setLngLat(marker.geometry.coordinates)
            .addTo(map);
    }
</script>

</body>
</html>
