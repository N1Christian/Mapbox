<!DOCTYPE html>
<html lang="en">
<head> <!--metadata, title, including external files, css style-->
    <meta charset="utf-8">
    <title>Add a new layer to a slot</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>

<body> <!--the map class -->

    <div id="map"></div>
<script>
	mapboxgl.accessToken = 'pk.eyJ1IjoibjFjaHJpc3RpYW4iLCJhIjoiY2x6MG80Y2hrMTgxaDJrcHNkMWtvZWx0MCJ9.kHvL5J2yJH2lPYSmk7sBng';
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/standard',
        center: [-74.0060152, 40.7127281],
        zoom: 5,
        maxZoom: 6
    });

    const geoJsonData = ``;
    
    //asynchronously adding the layer
    map.on('style.load', () => {
        map.addSource('urban-areas', {
            'type': 'geojson',
            'data': geoJsonData
        });

        map.addLayer({
            'id': 'urban-areas-fill',
            'type': 'fill',
            // This property allows you to identify which `slot` in
            // the Mapbox Standard your new layer should be placed in (`bottom`, `middle`, `top`).
            'slot': 'middle',
            'source': 'urban-areas',
            'layout': {},
            'paint': {
                'fill-color': '#f08',
                'fill-opacity': 0.4
            }
        });
    });
</script>
</body>
</html>
