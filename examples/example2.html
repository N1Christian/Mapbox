<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a generated icon to the map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
    <div id="map"></div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoibjFjaHJpc3RpYW4iLCJhIjoiY2x6MG80Y2hrMTgxaDJrcHNkMWtvZWx0MCJ9.kHvL5J2yJH2lPYSmk7sBng';
        const map = new mapboxgl.Map({
            container: 'map',
            center: [0, 0],
            zoom: 2,
            // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
            style: 'mapbox://styles/mapbox/streets-v12'
        });
    
        //event listener called when the load event is fired
        map.on('load', () => {
            const width = 64;
            const bytesPerPixel = 4;
            const data = new Uint8Array(width * width * bytesPerPixel);
    
            for (let x = 0; x < width; x++) {
                for (let y = 0; y < width; y++) {
                    const offset = (y * width + x) * bytesPerPixel;
                    data[offset + 0] = (y / width) * 255; // red
                    data[offset + 1] = (x / width) * 255; // green
                    data[offset + 2] = 128; // blue
                    data[offset + 3] = 255; // alpha
                }
            }

        map.addImage('gradient', { width: width, height: width, data: data });

        map.addSource('point', {
            'type': 'geojson',
            'data': {
                'type': 'FeatureCollection',
                'features': [
                    {
                        'type': 'Feature',
                        'geometry': {
                            'type': 'Point',
                            'coordinates': [0, 0]
                        }
                    }
                ]
            }
        });

        map.addLayer({
            'id': 'points',
            'type': 'symbol',
            'source': 'point',
            'layout': {
            'icon-image': 'gradient'
            }
        });
    });
</script>

</body>
</html>
